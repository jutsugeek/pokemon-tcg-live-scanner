<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scanner Códigos TCG Live - Jutsu Geek</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      padding: 16px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { 
      font-size: 1.6rem; 
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .header p { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; }
    .config, .scanner-container, .last-codes {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .config label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #cbd5e1; font-weight: 500; }
    select, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
    }
    select:focus, input:focus { border-color: #38bdf8; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; }
    .status { text-align: center; padding: 10px; font-size: 0.95rem; color: #94a3b8; }
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: white; padding: 14px 24px; border-radius: 12px;
      font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; max-width: 90%; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; }
    .btn-secondary { background: #334155; color: #f1f5f9; }
    .last-codes h3 { font-size: 1rem; margin-bottom: 10px; color: #cbd5e1; }
    .code-item { font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid #334155; word-break: break-all; }
    .code-item:last-child { border: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Scanner Códigos TCG Live</h1>
    <p>Jutsu Geek — Escaneie e salve na planilha</p>
  </div>
  <div class="config">
    <label for="appsScriptUrl">URL do Apps Script (Web App)</label>
    <input type="text" id="appsScriptUrl" placeholder="Cole aqui a URL do Web App do Google Apps Script">
    <label for="colecao" style="margin-top:12px">Coleção</label>
    <select id="colecao"></select>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <input type="text" id="novaColecao" placeholder="Nova coleção" style="flex:1;">
      <button class="btn" id="addColecaoBtn" style="width:auto; padding:12px 16px; margin-top:0; background:#334155;">+</button>
    </div>
  </div>
  <div class="scanner-container">
    <div id="reader"></div>
    <div class="status" id="status">Aguardando câmera...</div>
  </div>
  <button class="btn btn-primary" id="startBtn">Iniciar Câmera</button>
  <button class="btn btn-secondary hidden" id="stopBtn">Parar Câmera</button>
  <div class="last-codes">
    <h3>Últimos códigos escaneados (sessão)</h3>
    <div id="lastCodesList">Nenhum ainda</div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const APPS_SCRIPT_KEY = 'tcgl_apps_script_url';
    const SCANNED_KEY = 'tcgl_scanned_codes';
    const COLLECTIONS_KEY = 'tcgl_collections';
    const DEFAULT_COLLECTIONS = ['Delta Reign'];
    let scannedCodes = new Set(JSON.parse(localStorage.getItem(SCANNED_KEY) || '[]'));
    let html5QrCode = null;
    let isScanning = false;
    let scanCooldown = false;
    const colecaoSelect = document.getElementById('colecao');
    const appsScriptInput = document.getElementById('appsScriptUrl');
    const statusEl = document.getElementById('status');
    const toast = document.getElementById('toast');
    const lastCodesList = document.getElementById('lastCodesList');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const addColecaoBtn = document.getElementById('addColecaoBtn');
    const novaColecaoInput = document.getElementById('novaColecao');
    function loadCollections() {
      const saved = JSON.parse(localStorage.getItem(COLLECTIONS_KEY) || 'null');
      return saved || DEFAULT_COLLECTIONS;
    }
    function saveCollections(list) {
      localStorage.setItem(COLLECTIONS_KEY, JSON.stringify(list));
    }
    function populateCollections() {
      const list = loadCollections();
      colecaoSelect.innerHTML = '';
      list.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        colecaoSelect.appendChild(opt);
      });
    }
    async function loadCollectionsFromSheet() {
      const url = appsScriptInput.value.trim();
      if (!url) return;
      try {
        const res = await fetch(url, { method: 'GET', redirect: 'follow' });
        const text = await res.text();
        const data = JSON.parse(text);
        if (data.collections && Array.isArray(data.collections) && data.collections.length) {
          colecaoSelect.innerHTML = '';
          data.collections.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            colecaoSelect.appendChild(opt);
          });
          showToast('Coleções carregadas');
        }
      } catch (err) {
        console.error(err);
      }
    }
    populateCollections();
    appsScriptInput.value = localStorage.getItem(APPS_SCRIPT_KEY) || '';
    appsScriptInput.addEventListener('change', () => {
      localStorage.setItem(APPS_SCRIPT_KEY, appsScriptInput.value.trim());
      loadCollectionsFromSheet();
    });
    loadCollectionsFromSheet();
    addColecaoBtn.addEventListener('click', () => {
      const name = novaColecaoInput.value.trim();
      if (!name) return;
      const list = loadCollections();
      if (!list.includes(name)) {
        list.unshift(name);
        saveCollections(list);
        populateCollections();
        colecaoSelect.value = name;
        novaColecaoInput.value = '';
        showToast('Coleção adicionada');
      }
    });
    function getColecao() { return colecaoSelect.value; }
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 1800);
    }
    function addToLastCodes(code, colecao) {
      const item = document.createElement('div');
      item.className = 'code-item';
      item.textContent = code + ' — ' + colecao;
      if (lastCodesList.textContent === 'Nenhum ainda') lastCodesList.innerHTML = '';
      lastCodesList.prepend(item);
      while (lastCodesList.children.length > 10) lastCodesList.removeChild(lastCodesList.lastChild);
    }
    function markAsScanned(code) {
      scannedCodes.add(code);
      localStorage.setItem(SCANNED_KEY, JSON.stringify([...scannedCodes]));
    }
    function isAlreadyScanned(code) {
      return scannedCodes.has(code);
    }
    async function saveToSheet(code, colecao) {
      const url = appsScriptInput.value.trim();
      if (!url) { showToast('Configure a URL do Apps Script primeiro!', true); return false; }
      const formData = new URLSearchParams();
      formData.append('codigo', code);
      formData.append('colecao', colecao);
      formData.append('timestamp', new Date().toISOString());
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });
        return true;
      } catch (err) {
        showToast('Erro ao salvar: ' + err.message, true);
        return false;
      }
    }
    async function onScanSuccess(decodedText) {
      if (scanCooldown || !isScanning) return;
      const code = decodedText.trim().toUpperCase();
      if (!code) return;
      if (isAlreadyScanned(code)) {
        showToast('Código já escaneado! Tente outro cartão', true);
        statusEl.textContent = 'Código duplicado';
        scanCooldown = true;
        setTimeout(() => { scanCooldown = false; }, 2000);
        return;
      }
      scanCooldown = true;
      const colecao = getColecao();
      statusEl.textContent = 'Salvando...';
      const saved = await saveToSheet(code, colecao);
      if (saved) {
        markAsScanned(code);
        showToast('✓ Salvo: ' + code);
        addToLastCodes(code, colecao);
        statusEl.textContent = 'Pronto para o próximo!';
      } else {
        statusEl.textContent = 'Falha ao salvar.';
      }
      setTimeout(() => { scanCooldown = false; }, 1500);
    }
    function onScanFailure() {}
    async function startScanner() {
      if (isScanning) return;
      const url = appsScriptInput.value.trim();
      if (!url) { showToast('Cole a URL do Apps Script primeiro!', true); return; }
      html5QrCode = new Html5Qrcode('reader');
      try {
        await html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure);
        isScanning = true;
        statusEl.textContent = 'Aponte para o QR do código...';
        startBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
      } catch (err) {
        statusEl.textContent = 'Erro ao acessar câmera: ' + err;
        showToast('Permita o acesso à câmera', true);
      }
    }
    async function stopScanner() {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        statusEl.textContent = 'Câmera parada';
        startBtn.classList.remove('hidden');
        stopBtn.classList.add('hidden');
      }
    }
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
